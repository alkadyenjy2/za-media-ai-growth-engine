name: Convex Production Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "convex/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: convex-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Convex backend
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch and production deploy key
        shell: bash
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production backend deployments may only run from main."
            exit 1
          fi
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::Missing repository secret CONVEX_DEPLOY_KEY. Add a production-scoped Convex deploy key in GitHub Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy production backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          pnpm exec convex deploy --typecheck enable --message "GitHub Actions production deploy: ${GITHUB_SHA}"
