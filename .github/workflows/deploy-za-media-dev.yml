name: Deploy ZA Media Convex Development Preview

on:
  push:
    branches:
      - chore/za-static-host-fallback-20261012
    paths:
      - "preview-deployment.json"
      - ".github/workflows/deploy-za-media-dev.yml"

permissions:
  contents: write

concurrency:
  group: za-media-convex-development-preview
  cancel-in-progress: false

jobs:
  deploy-development:
    if: startsWith(github.event.head_commit.message, 'deploy-preview:') && github.ref == 'refs/heads/chore/za-static-host-fallback-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate that the key is scoped to the requested development deployment
        shell: bash
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.ZA_MEDIA_DEV_CONVEX_DEPLOY_KEY }}
        run: |
          case "${CONVEX_DEPLOY_KEY:-}" in
            'dev:rosy-hare-228|'*)
              echo "Development deployment key scope verified."
              ;;
            *)
              echo "::error::Add a Convex dev-only deployment key for rosy-hare-228 as repository secret ZA_MEDIA_DEV_CONVEX_DEPLOY_KEY. Do not use a production key."
              exit 1
              ;;
          esac

      - name: Create Better Auth secret only if not already configured
        shell: bash
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.ZA_MEDIA_DEV_CONVEX_DEPLOY_KEY }}
        run: |
          if pnpm exec convex env get BETTER_AUTH_SECRET >/dev/null 2>&1; then
            echo "BETTER_AUTH_SECRET is already configured; retaining it."
          else
            secret="$(openssl rand -base64 32 | tr -d '\n')"
            printf '%s' "$secret" | pnpm exec convex env set BETTER_AUTH_SECRET
            unset secret
            echo "Created a random Better Auth secret without printing its value."
          fi

      - name: Set the allowed Preview origin
        shell: bash
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.ZA_MEDIA_DEV_CONVEX_DEPLOY_KEY }}
        run: |
          preview_origin="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('preview-deployment.json', 'utf8')).siteUrl)")"
          test -n "$preview_origin"
          pnpm exec convex env set SITE_URL "$preview_origin"

      - name: Deploy the Convex functions to the scoped development deployment
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.ZA_MEDIA_DEV_CONVEX_DEPLOY_KEY }}
        run: pnpm exec convex dev --once

      - name: Enable the branch-only frontend endpoints after backend deploy succeeds
        uses: actions/github-script@v7
        with:
          script: |
            const expectedBranch = 'chore/za-static-host-fallback-20261012';
            if (context.ref !== `refs/heads/${expectedBranch}`) {
              core.setFailed('Refusing to enable preview endpoints outside the dedicated feature branch.');
              return;
            }

            const path = 'preview-deployment.json';
            const { owner, repo } = context.repo;
            const response = await github.rest.repos.getContent({
              owner,
              repo,
              path,
              ref: expectedBranch,
            });

            if (Array.isArray(response.data) || !response.data.content) {
              core.setFailed('Could not read the preview deployment config.');
              return;
            }

            const config = JSON.parse(
              Buffer.from(response.data.content, 'base64').toString('utf8'),
            );
            if (config.branch !== expectedBranch) {
              core.setFailed('Preview deployment config branch did not match the guarded branch.');
              return;
            }

            if (config.enabled === true) {
              core.notice('Branch-only Convex frontend endpoints are already enabled.');
              return;
            }

            config.enabled = true;
            delete config.deploymentRequestedAt;
            const content = Buffer.from(`${JSON.stringify(config, null, 2)}\n`).toString('base64');

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch: expectedBranch,
              message: 'deploy: enable ZA Media development preview after backend deploy',
              sha: response.data.sha,
              content,
            });
            core.notice('Enabled the branch-only endpoints; Cloudflare Pages will rebuild this Preview branch.');
